# 将 <YOUR_DOMAIN> 换成 maimai.imikufans.cn;网关 :9560,前端 :9561
upstream maimai_front { server 127.0.0.1:9561; }
upstream maimai_api { server 127.0.0.1:9560; }

server {
    listen 80;
    server_name maimai.imikufans.cn;

    # SSE 实时推送:必须关缓冲(前缀匹配,带查询串也要走这里)
    location ^~ /api/stream {
        proxy_pass http://maimai_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://maimai_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://maimai_front;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
